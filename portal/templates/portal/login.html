<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — TaxVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-screen items-center justify-center bg-slate-950 font-sans">
  <div class="w-full max-w-sm rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-xl">
    <div class="mb-6 flex items-center gap-2">
      <div class="flex h-8 w-8 items-center justify-center rounded-md bg-sky-500 text-sm font-bold text-white">TV</div>
      <span class="text-base font-bold tracking-wide text-white">TaxVault</span>
    </div>

    {% if form.errors %}
    <div class="mb-4 rounded-lg border border-rose-800 bg-rose-950 px-4 py-2.5 text-sm text-rose-300">
      Invalid username or password.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="space-y-4">
        <div>
          <label class="mb-1 block text-xs font-medium text-slate-400">Username</label>
          <input type="text" name="username" autofocus required class="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-white outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-slate-400">Password</label>
          <input type="password" name="password" required class="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-white outline-none focus:border-sky-500">
        </div>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="mt-6 w-full rounded-lg bg-sky-500 px-4 py-2.5 text-sm font-medium text-white hover:bg-sky-400">
        Log in
      </button>
    </form>
  </div>
</body>
</html>
