<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — TaxVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at 20% 20%, #312e81 0%, #0f172a 45%, #020617 100%);
    }
    .brand-gradient { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #d946ef 100%); }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      box-shadow: 0 4px 14px -4px rgba(99, 102, 241, 0.5);
      transition: all 0.15s ease;
    }
    .btn-primary:hover { background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%); transform: translateY(-1px); }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
    .float-anim { animation: float 5s ease-in-out infinite; }
    @keyframes float-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    .orb { position: absolute; border-radius: 9999px; filter: blur(60px); opacity: 0.35; animation: float-slow 8s ease-in-out infinite; }
  </style>
</head>
<body class="relative flex h-screen items-center justify-center overflow-hidden">
  <div class="orb h-72 w-72 bg-indigo-500" style="top: 10%; left: 12%;"></div>
  <div class="orb h-80 w-80 bg-fuchsia-500" style="bottom: 8%; right: 10%; animation-delay: 2s;"></div>
  <div class="orb h-56 w-56 bg-violet-500" style="top: 55%; left: 55%; animation-delay: 4s;"></div>

  <div class="relative w-full max-w-sm rounded-2xl border border-white/10 bg-white/[0.04] p-8 shadow-2xl backdrop-blur-xl">
    <div class="mb-2 flex justify-center">
      <div class="float-anim brand-gradient flex h-14 w-14 items-center justify-center rounded-2xl text-xl font-bold text-white shadow-lg shadow-indigo-500/40">TV</div>
    </div>
    <div class="mb-6 text-center">
      <h1 class="text-lg font-bold tracking-wide text-white">TaxVault</h1>
      <p class="mt-0.5 text-xs text-slate-400">Document collection, sorted.</p>
    </div>

    {% if form.errors %}
    <div class="mb-4 rounded-lg border border-rose-800/60 bg-rose-950/60 px-4 py-2.5 text-sm text-rose-300">
      Invalid username or password.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="space-y-4">
        <div>
          <label class="mb-1 block text-xs font-medium text-slate-400">Username</label>
          <input type="text" name="username" autofocus required class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-white outline-none transition-colors focus:border-indigo-400">
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-slate-400">Password</label>
          <input type="password" name="password" required class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-white outline-none transition-colors focus:border-indigo-400">
        </div>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn-primary mt-6 w-full rounded-lg px-4 py-2.5 text-sm font-medium text-white">
        Log in
      </button>
    </form>
  </div>
</body>
</html>
