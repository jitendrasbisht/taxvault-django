services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-taxvault}
      POSTGRES_USER: ${DB_USER:-taxvault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taxvault}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taxvault}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
