{% extends "admin/base_site.html" %}

{% block content %}
<h1>{{ title }}</h1>
<p>Resetting the password for <strong>{{ profile.user.username }}</strong> ({{ profile.get_role_display }} @ {{ profile.firm.name }}).</p>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <table>
    {{ form.as_table }}
  </table>
  <input type="submit" value="Reset Password" class="default">
</form>
{% endblock %}
